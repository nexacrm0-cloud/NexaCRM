name: CI

on:
  push:
    # The repo's default branch is `master` (NOT `main`): with `main` only, the
    # CI never validated a single push.
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # `next lint` is deprecated and can ask for interactive input, which
      # always fails on CI. Running eslint directly does the same thing.
      - run: pnpm --filter @nexa/api lint
      - run: pnpm --filter @nexa/web exec eslint "src/**/*.{ts,tsx}"

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexa/database db:generate
      # @nexa/api imports @nexa/shared, @nexa/domain and @nexa/database, and
      # all three resolve to dist/index.js (dist/ is gitignored, so it is not
      # in the checkout). They have to be compiled BEFORE the api build,
      # exactly like in the Dockerfile.
      - run: pnpm --filter @nexa/shared build
      - run: pnpm --filter @nexa/domain build
      - run: pnpm --filter @nexa/database build
      - run: pnpm --filter @nexa/api build

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa123
          POSTGRES_DB: nexacrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexacrm"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10
      # No redis service on purpose: the API falls back to in-memory storage
      # when REDIS_URL is not set (throttler + login attempts), so the test
      # job does not depend on a second container to boot.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexa/database db:generate
      # The specs import @nexa/shared and @nexa/database, which resolve to
      # dist/index.js. Without compiling them first the suites fail with
      # "Cannot find module '@nexa/shared'".
      - run: pnpm --filter @nexa/shared build
      - run: pnpm --filter @nexa/domain build
      - run: pnpm --filter @nexa/database build
      # `migrate deploy` (not `migrate dev`): dev is interactive and always
      # fails on CI.
      - run: pnpm --filter @nexa/database db:migrate:deploy
        env:
          DATABASE_URL: postgresql://nexa:nexa123@localhost:5432/nexacrm?schema=public
      - run: pnpm --filter @nexa/api test
        env:
          DATABASE_URL: postgresql://nexa:nexa123@localhost:5432/nexacrm?schema=public
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-jwt-refresh-secret

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexa/database db:generate
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://nexa:nexa123@localhost:5432/nexacrm?schema=public
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          API_URL: http://localhost:4000
