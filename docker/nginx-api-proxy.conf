# Snippet para el reverse proxy del VPS (nginx) que hoy sirve el web.
#
# Pegarlo dentro del `server { ... }` que atiende nexa.nexacrm.dpdns.org,
# junto al `location /` que ya proxea al web.
#
# Con esto el navegador pide /api/* al MISMO origen (el dominio publico) y
# nginx lo reenvia a la API local -> sin CORS y con las cookies de sesion
# funcionando (mismo origen).
#
# La API (docker-compose.backend.yml) escucha en 127.0.0.1:4000.
# Si el proxy corre en Docker, usar http://api:4000 (misma red) o
# http://host.docker.internal:4000.

location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    client_max_body_size 25m;
}

location /uploads/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
