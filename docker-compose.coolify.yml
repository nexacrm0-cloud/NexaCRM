# ==============================================================
# NEXACRM - ARCHIVO PARA COOLIFY (NO CONFUNDIR CON docker-compose.yml)
# Este es el unico archivo que debe llamarse docker-compose.coolify.yml.
# Verificacion rapida: la primera linea dice NEXACRM y los unicos
# servicios son los de NexaCRM (api, web, postgres, redis, migrate, backup).
# ==============================================================
# Nexa CRM - Stack de produccion para Coolify (Servidor Obelisco)
# ==============================================================
# Derivado de docker-compose.prod.yml con estos cambios:
#   - Se eliminan los servicios `nginx` y `certbot`: ahora el proxy
#     y los certificados los maneja Traefik (Coolify) en 80/443.
#   - Se quitan los `ports:` de api/web: el proxy enruta por puerto
#     interno (Traefik etiqueta los contenedores y los expone).
#   - Se usa la red externa `coolify` para que Traefik alcance los servicios.
#   - Un unico superusuario de Postgres para app y migraciones: la
#     migracion 20260808120000_enable_rls crea los roles nexa_app /
#     nexa_admin y hace GRANT ... TO CURRENT_USER, igual que en Render.
#     El TenantMiddleware hace SET ROLE nexa_app por request (RLS).
#   - `migrate` corre una sola vez (exclude_from_hc) antes de api.
# ==============================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es requerido}
      POSTGRES_DB: ${POSTGRES_DB:-nexacrm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nexa} -d ${POSTGRES_DB:-nexacrm}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coolify

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD es requerido}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coolify

  # Corre una vez al desplegar: aplica las migraciones de Prisma.
  # Necesita superusuario (CREATEROLE) para crear los roles de RLS.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: 'no'
    entrypoint: ['npx', 'prisma', 'migrate', 'deploy']
    working_dir: /app/packages/database
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexacrm}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coolify

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      API_PORT: '4000'
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL es requerido (URL publica del web)}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexacrm}?schema=public
      RLS_APP_ROLE: ${RLS_APP_ROLE:-nexa_app}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es requerido}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET es requerido}
      JWT_2FA_PENDING_SECRET: ${JWT_2FA_PENDING_SECRET:?JWT_2FA_PENDING_SECRET es requerido}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY es requerido}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@nexacrm.com}
      WORKFLOWS_ENABLED: ${WORKFLOWS_ENABLED:-false}
      ALLOW_STUB_PAYMENT_IN_PROD: ${ALLOW_STUB_PAYMENT_IN_PROD:-}
      PAYMENT_PROVIDER_KIND: ${PAYMENT_PROVIDER_KIND:-stub}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_SANDBOX_MODE: ${MP_SANDBOX_MODE:-false}
      MP_WEBHOOK_URL: ${MP_WEBHOOK_URL:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_API_BASE_URL: ${MP_API_BASE_URL:-https://api.mercadopago.com}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.1}
      AFIP_ENABLED: ${AFIP_ENABLED:-false}
      AFIP_PROVIDER_KIND: ${AFIP_PROVIDER_KIND:-stub}
      AFIP_CUIT: ${AFIP_CUIT:-}
      AFIP_CERT_PATH: ${AFIP_CERT_PATH:-}
      AFIP_KEY_PATH: ${AFIP_KEY_PATH:-}
      AFIP_ENV: ${AFIP_ENV:-testing}
      ALLOW_STUB_AFIP_IN_PROD: ${ALLOW_STUB_AFIP_IN_PROD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-auto}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
    expose:
      - '4000'
    # Routing hacia Traefik (modo raw compose: las labels se escriben aca).
    labels:
      - traefik.enable=true
      - traefik.http.routers.nexacrm-api.rule=Host(`api.192.168.0.101.nip.io`)
      - traefik.http.routers.nexacrm-api.entryPoints=http
      - traefik.http.services.nexacrm-api.loadbalancer.server.port=4000
    networks:
      - coolify

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_HOST: ${NEXT_PUBLIC_SENTRY_HOST:-sentry.io}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.1}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    expose:
      - '3000'
    # Routing hacia Traefik (modo raw compose: las labels se escriben aca).
    labels:
      - traefik.enable=true
      - traefik.http.routers.nexacrm-web.rule=Host(`nexa.192.168.0.101.nip.io`)
      - traefik.http.routers.nexacrm-web.entryPoints=http
      - traefik.http.services.nexacrm-web.loadbalancer.server.port=3000
    networks:
      - coolify

  # Backup diario de Postgres (pg_dump en formato custom).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - ./docker/backups:/backups
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-nexa}
      POSTGRES_DB: ${POSTGRES_DB:-nexacrm}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c '
        set -e
        echo "[backup] starting daily pg_dump loop"
        while true; do
          PGPASSWORD=$$POSTGRES_PASSWORD pg_dump \
            -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB \
            -F c -f /backups/nexa_$$(date +%Y%m%d_%H%M%S).dump
          find /backups -name "*.dump" -mtime +7 -delete
          sleep 86400
        done
      '
    networks:
      - coolify

volumes:
  postgres_data:
  redis_data:

networks:
  coolify:
    external: true
