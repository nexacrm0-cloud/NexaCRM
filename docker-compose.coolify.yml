# ==============================================================
# SERVIDOR OBELISCO - Infraestructura de servidor
# Aloja: agentes IA, sistemas de software, bases de datos
# Uso: docker compose --profile core --profile ai up -d
# ==============================================================

networks:
  obelisco-net:
    driver: bridge

volumes:
  postgres18_data:
  redis_data:
  ollama_data:
  n8n_data:
  open_webui_data:
  portainer_data:
  grafana_data:
  prometheus_data:

services:
  # ------------------- BASES DE DATOS -------------------

  postgres:
    image: postgres:18-alpine
    container_name: obelisco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres18_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./data/db:/data-backup
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - obelisco-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: obelisco-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - obelisco-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ------------------- AGENTES DE IA -------------------

  ollama:
    image: ollama/ollama:latest
    container_name: obelisco-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT}:11434"
    networks:
      - obelisco-net
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 6G

  n8n:
    image: n8nio/n8n:latest
    container_name: obelisco-n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://${N8N_HOST}:${N8N_WEBHOOK_PORT}/
      - GENERIC_TIMEZONE=${TIMEZONE}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - OLLAMA_HOST=http://ollama:${OLLAMA_PORT}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data/apps:/data/files
    ports:
      - "${N8N_PORT}:5678"
    networks:
      - obelisco-net
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G

  # ------------------- OPEN WEBUI (panel web IA) -------------------

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: obelisco-open-webui
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open_webui_data:/app/backend/data
    ports:
      - "${OPEN_WEBUI_PORT}:8080"
    networks:
      - obelisco-net
    depends_on:
      - ollama
    deploy:
      resources:
        limits:
          memory: 1G

  # ------------------- SISTEMAS / APPS -------------------
  # Cada sistema de tu empresa se agrega como un servicio aqui.
  # Ejemplo de plantilla:
  #
  # mi-sistema:
  #   build: ./data/apps/mi-sistema
  #   container_name: obelisco-mi-sistema
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  #     REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - obelisco-net
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # ------------------- GESTION (PORTAINER) -------------------

  portainer:
    image: portainer/portainer-ce:latest
    container_name: obelisco-portainer
    restart: unless-stopped
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${PORTAINER_PORT}:9443"
    networks:
      - obelisco-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ------------------- REVERSE PROXY -------------------

  nginx:
    image: nginx:alpine
    container_name: obelisco-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    networks:
      - obelisco-net
    depends_on:
      - portainer
      - n8n
    deploy:
      resources:
        limits:
          memory: 128M

  # ------------------- MONITORING (opcional) -------------------
  # Activar con: docker compose --profile monitoring up -d

  prometheus:
    image: prom/prometheus:latest
    container_name: obelisco-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - obelisco-net
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    container_name: obelisco-grafana
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    networks:
      - obelisco-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
