services:
  postgres:
    image: postgres:16-alpine
    container_name: nexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nexacrm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nexa} -d ${POSTGRES_DB:-nexacrm}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexa-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexa-migrate
    entrypoint: ['npx', 'prisma', 'migrate', 'deploy']
    working_dir: /app/packages/database
    environment:
      # IMPORTANT: migrate runs as nexa_admin (BYPASSRLS) because it needs
      # to CREATE/ALTER/DROP tables across all tenants. NEVER point the
      # api service at this URL — it bypasses RLS.
      DATABASE_URL: postgresql://${DB_ADMIN_USER:-nexa_admin}:${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-nexacrm}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexa-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      API_PORT: '4000'
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      # Runtime DATABASE_URL points at nexa_app (NOBYPASSRLS). The
      # TenantMiddleware additionally does `SET ROLE nexa_app` per request
      # to enforce fail-closed Row Level Security. See migration
      # 20260808120000_enable_rls for the role + policy definitions.
      DATABASE_URL: postgresql://${DB_APP_USER:-nexa_app}:${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-nexacrm}?schema=public
      # Role name the TenantMiddleware swaps to per request. Default is
      # nexa_app (matches the migration). Override only if a downstream
      # operator renamed the role.
      RLS_APP_ROLE: ${RLS_APP_ROLE:-nexa_app}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@nexacrm.com}
      WORKFLOWS_ENABLED: ${WORKFLOWS_ENABLED:-false}
      ALLOW_STUB_PAYMENT_IN_PROD: ${ALLOW_STUB_PAYMENT_IN_PROD:-}
      PAYMENT_PROVIDER_KIND: ${PAYMENT_PROVIDER_KIND:-stub}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_SANDBOX_MODE: ${MP_SANDBOX_MODE:-false}
      MP_WEBHOOK_URL: ${MP_WEBHOOK_URL:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_API_BASE_URL: ${MP_API_BASE_URL:-https://api.mercadopago.com}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.1}
      AFIP_ENABLED: ${AFIP_ENABLED:-false}
      AFIP_PROVIDER_KIND: ${AFIP_PROVIDER_KIND:-stub}
      AFIP_CUIT: ${AFIP_CUIT:-}
      AFIP_CERT_PATH: ${AFIP_CERT_PATH:-}
      AFIP_KEY_PATH: ${AFIP_KEY_PATH:-}
      AFIP_ENV: ${AFIP_ENV:-testing}
      ALLOW_STUB_AFIP_IN_PROD: ${ALLOW_STUB_AFIP_IN_PROD:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-auto}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
    expose:
      - '4000'
    ports:
      - '127.0.0.1:4000:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_HOST: ${NEXT_PUBLIC_SENTRY_HOST:-sentry.io}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.1}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    container_name: nexa-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    expose:
      - '3000'
    ports:
      - '127.0.0.1:3000:3000'

  nginx:
    image: nginx:1.27-alpine
    container_name: nexa-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/letsencrypt
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
      - api

  certbot:
    image: certbot/certbot
    container_name: nexa-certbot
    restart: unless-stopped
    volumes:
      - ./docker/ssl:/etc/letsencrypt
      - certbot_data:/var/www/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"

  backup:
    image: postgres:16-alpine
    container_name: nexa-backup
    restart: unless-stopped
    volumes:
      - ./docker/backups:/backups
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-nexa}
      POSTGRES_DB: ${POSTGRES_DB:-nexacrm}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c '
        set -e
        echo "[backup] starting daily pg_dump loop"
        while true; do
          PGPASSWORD=$$POSTGRES_PASSWORD pg_dump \
            -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB \
            -F c -f /backups/nexa_$$(date +%Y%m%d_%H%M%S).dump
          find /backups -name "*.dump" -mtime +7 -delete
          sleep 86400
        done
      '

volumes:
  postgres_data:
  redis_data:
  certbot_data:
  nginx_logs:
